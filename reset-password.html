<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | ProtoIQ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 24px; line-height: 1.6;">
  <h1>Reset your ProtoIQ password</h1>

  <p>Enter your new password below.</p>

  <input
    id="password"
    type="password"
    placeholder="New password"
    style="width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 12px;"
  />

  <input
    id="confirmPassword"
    type="password"
    placeholder="Confirm new password"
    style="width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 16px;"
  />

  <button
    onclick="resetPassword()"
    style="width: 100%; padding: 14px; border-radius: 12px; background: #111; color: white; font-weight: 800; border: 0; font-size: 16px;"
  >
    Update password
  </button>

  <p id="message" style="margin-top: 16px; font-weight: 700;"></p>

  <script>
    const SUPABASE_URL = "https://xhriaptqwkrcllabubhu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__xca2St6PkItTOhwVg07RQ_vL5lRVY0";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: true,
        flowType: "implicit"
      }
    });

    async function resetPassword() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (!password || !confirmPassword) {
        message.innerText = "Please complete both fields.";
        return;
      }

      if (password.length < 6) {
        message.innerText = "Password must be at least 6 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        return;
      }

      const { error } = await client.auth.updateUser({
        password: password
      });

      if (error) {
        message.innerText = error.message;
        return;
      }

      message.innerText = "Password updated. You can now return to the ProtoIQ app and sign in.";
    }
  </script>
</body>
</html>
